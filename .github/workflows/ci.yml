name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Merges made with GITHUB_TOKEN (the Dependabot auto-merge below) don't
  # trigger `push` runs, so the automerge job dispatches this workflow on main.
  workflow_dispatch:

permissions:
  contents: read

# Runs on main queue in commit order (a newer queued run replaces an older
# queued one), so publish never pushes an older sha over :latest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Build image
        run: docker build -t amazon-sp-mcp:ci .
      - name: Container smoke test
        run: |
          docker run -d --name smoke -p 3100:3000 \
            -e LWA_CLIENT_ID=dummy -e LWA_CLIENT_SECRET=dummy \
            -e LWA_REFRESH_TOKEN=dummy -e MARKETPLACE_ID=A21TJRUUN4KGV \
            amazon-sp-mcp:ci
          for _ in $(seq 30); do
            curl -fs http://localhost:3100/health && break
            sleep 1
          done
          python scripts/smoke.py http://localhost:3100
      - name: Container logs
        if: failure()
        run: docker logs smoke || true

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ env.REPO_URL }}
            org.opencontainers.image.revision=${{ github.sha }}
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}

  automerge:
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - run: gh pr merge "$PR" --squash --delete-branch
      - run: gh workflow run ci.yml --ref main
