services:
  amazon-sp-mcp:
    # Production pulls the CI-built image; `build: .` is for local dev only.
    image: ghcr.io/shbhnkr-sg/amazon-sp-mcp:latest
    build: .
    container_name: amazon-sp-mcp
    restart: unless-stopped
    labels:
      # Watchtower pulls new :latest images (built by CI on every main push).
      # The upgrade delay lives in Dependabot (cooldown), so none here.
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.cooldown-delay: "0"
    # Exposed on all host interfaces so other LAN devices can connect.
    # NOTE: the server has no auth — anyone who can reach this port can read
    # your Amazon seller data. Keep this host on a trusted network only.
    ports:
      - "3100:3000"
    env_file:
      - .env
    environment:
      LWA_CLIENT_ID: ${LWA_CLIENT_ID:?missing LWA_CLIENT_ID}
      LWA_CLIENT_SECRET: ${LWA_CLIENT_SECRET:?missing LWA_CLIENT_SECRET}
      LWA_REFRESH_TOKEN: ${LWA_REFRESH_TOKEN:?missing LWA_REFRESH_TOKEN}
      MARKETPLACE_ID: ${MARKETPLACE_ID:-A21TJRUUN4KGV}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
